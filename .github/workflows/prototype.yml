name: Prototype cloud checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Install cloud browser
        run: npx playwright install --with-deps chromium
      - name: Browser, accessibility and payload checks
        run: npm test

  verify-hosted:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      PLAYWRIGHT_BASE_URL: https://sinnara.pages.dev
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Check public deployment response
        run: |
          node --input-type=module -e "for(const p of ['/','/en/','/ar/']){const r=await fetch(process.env.PLAYWRIGHT_BASE_URL+p);console.log(JSON.stringify({path:p,status:r.status,url:r.url,type:r.headers.get('content-type'),robots:r.headers.get('x-robots-tag'),excerpt:(await r.text()).slice(0,300)}));if(!r.ok)process.exitCode=1}"
      - run: npm ci
      - name: Install cloud browser
        run: npx playwright install --with-deps chromium
      - name: Test deployed English and Arabic flows
        run: npm test
