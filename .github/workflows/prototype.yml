name: Prototype cloud checks
on:
  push:
    branches: [phase-1-cloud-prototype]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci
      - name: Format source for review
        run: |
          npx --yes prettier@3.6.2 --write src tests scripts next.config.ts playwright.config.ts tsconfig.json package.json
          node -e "const fs=require('node:fs');function emit(p){if(fs.statSync(p).isDirectory()){for(const n of fs.readdirSync(p))emit(p+'/'+n)}else console.log('FORMATTED_FILE_JSON='+JSON.stringify({path:p,content:fs.readFileSync(p,'utf8')}))}['src','tests','scripts','next.config.ts','playwright.config.ts','tsconfig.json','package.json'].forEach(emit)"
      - run: npm run typecheck
      - run: npm run build
      - name: Install cloud browser
        run: npx playwright install --with-deps chromium
      - name: Browser, accessibility and payload checks
        run: npm test
